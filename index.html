
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Football Director</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
      
      :root {
        --fot-bg-primary: #0F1419;
        --fot-bg-secondary: #151A21;
        --fot-bg-card: rgba(30, 41, 59, 0.4);
        --fot-bg-card-hover: rgba(30, 41, 59, 0.6);
        --fot-border: rgba(255, 255, 255, 0.06);
        --fot-accent: #00D4FF; /* Electric Cyan */
        --fot-accent-glow: rgba(0, 212, 255, 0.4);
        --fot-success: #00FF85;
        --fot-danger: #FF3B5C;
        --fot-text-primary: #FFFFFF;
        --fot-text-secondary: #94A3B8;
        
        --glass-blur: 16px;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--fot-bg-primary);
        color: var(--fot-text-primary);
        /* Subtle mesh gradient base */
        background-image: 
          radial-gradient(circle at 50% 0%, rgba(0, 212, 255, 0.08) 0%, transparent 60%),
          radial-gradient(circle at 100% 100%, rgba(0, 255, 133, 0.03) 0%, transparent 40%);
        background-attachment: fixed;
        min-height: 100vh;
      }
      
      /* Reset specific fonts to Inter for modern clean look */
      h1, h2, h3, .font-sport {
        font-family: 'Inter', sans-serif !important;
        letter-spacing: -0.03em;
      }

      /* Liquid Glass Card */
      .fot-card {
        background: var(--fot-bg-card);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border: 1px solid var(--fot-border);
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        transition: transform 0.2s ease, border-color 0.2s ease;
      }
      
      .fot-card:hover {
        border-color: rgba(255,255,255,0.1);
      }

      /* Buttons */
      .btn-base {
        border-radius: 12px;
        font-weight: 600;
        letter-spacing: -0.01em;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-primary {
        background: var(--fot-accent);
        color: #0F1419;
        border: 1px solid transparent;
        box-shadow: 0 0 15px var(--fot-accent-glow);
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 0 25px var(--fot-accent-glow);
        background: #33DDFF;
      }
      .btn-primary:disabled {
        background: #334155;
        color: #64748B;
        box-shadow: none;
      }

      .btn-secondary {
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--fot-border);
        color: var(--fot-text-primary);
      }
      .btn-secondary:hover {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.2);
      }

      .btn-danger {
        background: rgba(255, 59, 92, 0.1);
        border: 1px solid rgba(255, 59, 92, 0.3);
        color: var(--fot-danger);
      }
      .btn-danger:hover {
        background: var(--fot-danger);
        color: white;
        box-shadow: 0 0 15px rgba(255, 59, 92, 0.4);
      }

      .btn-ghost {
        background: transparent;
        color: var(--fot-text-secondary);
      }
      .btn-ghost:hover {
        color: var(--fot-text-primary);
        background: rgba(255,255,255,0.05);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }

      /* Match Elements */
      .fot-score {
        font-size: 4rem;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.05em;
        background: linear-gradient(180deg, #fff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 4px rgba(0,0,0,0.3));
      }

      .fot-live-badge {
        background: var(--fot-danger);
        box-shadow: 0 0 10px rgba(255, 59, 92, 0.5);
        animation: pulse-red 2s infinite;
      }

      @keyframes pulse-red {
        0% { box-shadow: 0 0 0 0 rgba(255, 59, 92, 0.7); }
        70% { box-shadow: 0 0 0 6px rgba(255, 59, 92, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 59, 92, 0); }
      }

      @keyframes shake {
        0%, 100% { transform: translate(0, 0); }
        10%, 30%, 50%, 70%, 90% { transform: translate(-2px, -2px); }
        20%, 40%, 60%, 80% { transform: translate(2px, 2px); }
      }
      .animate-shake {
        animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
      }

      /* Weather Overlays */
      .weather-rain { background-image: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%); background-size: 2px 40px; animation: rain 0.4s linear infinite; opacity: 0.3; }
      @keyframes rain { 0% { background-position: 0 0; } 100% { background-position: 10px 100%; } }
    </style>

</head>
